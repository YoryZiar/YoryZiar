name: Perbarui Statistik Profil

# Menjaga blok statistik pada README tetap jujur: seluruh angkanya dibaca ulang
# dari sumber publik dan dituliskan kembali secara otomatis.
#
# Jadwal: setiap Senin 01:00 WITA (Minggu 17:00 UTC).
# WITA = UTC+8 tanpa waktu musim panas, sehingga pemetaan jam ini tetap.
on:
  schedule:
    - cron: "0 17 * * 0"
  workflow_dispatch:      # dapat dijalankan manual dari tab Actions

# Izin minimum yang dibutuhkan: hanya menulis isi repositori.
permissions:
  contents: write

# Cegah dua pembaruan berjalan bersamaan dan saling menimpa.
concurrency:
  group: perbarui-statistik
  cancel-in-progress: false

jobs:
  perbarui:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repositori
        uses: actions/checkout@v5

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Uji penyusun blok statistik
        run: python3 tests/test_render.py

      - name: Perbarui blok statistik pada README
        env:
          # GITHUB_TOKEN hanya dipakai untuk MEMBACA API (batas laju 5.000/jam,
          # bukan 60/jam milik permintaan anonim). Skrip tidak memanggil API tulis.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: Asia/Makassar
        run: python3 scripts/update_stats.py

      - name: Commit dan push bila ada perubahan
        run: |
          set -euo pipefail

          if git diff --quiet -- README.md; then
            echo "Tidak ada perubahan pada README.md — statistik sudah mutakhir."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "chore(stats): perbarui statistik profil otomatis"
          git push
