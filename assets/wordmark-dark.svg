<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-label="Yory Ziar — Full-Stack Engineer">
  <defs>
    <linearGradient id="accentDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dcfff"/>
      <stop offset="55%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
    <linearGradient id="ruleDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#bb9af7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridDark" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="229" rx="14" fill="#0d1117" stroke="#30363d"/>
  <rect x="1" y="1" width="898" height="228" rx="14" fill="url(#gridDark)" opacity="0.85"/>

  <!-- title bar -->
  <circle cx="30" cy="28" r="6" fill="#ff5f56"/>
  <circle cx="52" cy="28" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="28" r="6" fill="#27c93f"/>
  <text x="872" y="33" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#484f58">~/profile</text>
  <line x1="1" y1="50" x2="899" y2="50" stroke="#21262d"/>

  <!-- prompt -->
  <text x="34" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#8b949e">yoryziar@github<tspan fill="#484f58">:</tspan><tspan fill="#7aa2f7">~</tspan><tspan fill="#8b949e">$</tspan><tspan fill="#e6edf3"> ./portfolio.sh --profile</tspan></text>

  <!-- name -->
  <text x="32" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="60" font-weight="700" letter-spacing="4" fill="url(#accentDark)">YORY ZIAR</text>

  <!-- status line -->
  <text x="34" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#8b949e">FULL-STACK ENGINEER <tspan fill="#484f58">·</tspan> MATARAM, NTB <tspan fill="#484f58">·</tspan> <tspan fill="#7dcfff">[ STATUS: SHIPPING ]</tspan></text>

  <line x1="34" y1="208" x2="866" y2="208" stroke="url(#ruleDark)" stroke-width="2"/>
</svg>
